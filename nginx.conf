# ============================================================================
#  FPIA — configuração do nginx dentro do container
#
#  Os arquivos do site ficam em /var/www/fpia/.
#
#  O proxy do Easypanel (Traefik) pode entregar a requisição de duas formas,
#  dependendo de como o domínio é configurado:
#
#    A) com o caminho completo   ->  o container recebe  /fpia/assets/...
#    B) com o prefixo removido   ->  o container recebe  /assets/...
#
#  A documentação do Easypanel não deixa claro qual das duas acontece, então
#  esta configuração atende AS DUAS. Não é preciso descobrir qual é: funciona
#  de qualquer jeito, e continua funcionando se esse comportamento mudar.
# ============================================================================

# Cache: HTML sempre revalidado, estáticos guardados por 30 dias.
# Fica aqui fora do server{} porque "map" só vale no contexto http.
map $uri $fpia_cache {
    default                                              "no-cache";
    ~*\.(css|js|png|jpe?g|gif|svg|ico|woff2?|mp4|webp)$   "public, max-age=2592000";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    index index.html;

    # Redirecionamentos relativos: sem isto o nginx devolveria o host/porta
    # internos do container (ex.: http://localhost:80/fpia/) ao adicionar a
    # barra final, quebrando o acesso através do proxy.
    absolute_redirect off;
    port_in_redirect  off;

    add_header Cache-Control        $fpia_cache always;
    add_header X-Content-Type-Options nosniff    always;
    add_header Referrer-Policy      strict-origin-when-cross-origin always;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;
    # nota: mp4/jpg/png já são comprimidos, gzip neles só gastaria CPU.

    # ---- Caso A: o container recebe o caminho completo (/fpia/...) ---------
    location = /fpia {
        return 301 /fpia/;          # sem a barra final os caminhos relativos quebram
    }

    location /fpia/ {
        root /var/www;              # /var/www + /fpia/... = /var/www/fpia/...
        try_files $uri $uri/ /fpia/index.html;
    }

    # ---- Caso B: o proxy removeu o prefixo (o container recebe /) ----------
    # Também serve para acessar a raiz do domínio, se você apontar o domínio
    # sem path. Para que a raiz REDIRECIONE para /fpia/ em vez de mostrar a
    # página, troque este bloco por:  location = / { return 301 /fpia/; }
    location / {
        root /var/www/fpia;
        try_files $uri $uri/ /index.html;
    }

    # ---- Verificação de saúde (usada pelo Easypanel/monitoramento) ---------
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
